name: BuildChecker Lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildchecker-lab:
    name: e7-a-quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan tracked sources and Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/buildchecker/ci-scan
          git rev-parse HEAD > work/buildchecker/ci-scan/commit.txt
          python3 scripts/secret_scan.py . --history 2>&1 | tee work/buildchecker/ci-scan/source-scan.log

      - name: Build A group image and run service tests
        run: python3 scripts/buildchecker/lab.py build --image buildchecker-lab:ci --out work/buildchecker/ci-build

      - name: Scan built image
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/secret_scan.py . --image buildchecker-lab:ci 2>&1 | tee work/buildchecker/ci-scan/image-scan.log

      - name: Test lab runner and gate decisions
        run: docker run --rm --network none buildchecker-lab:ci python3 -m unittest discover -s tests/buildchecker_lab -v

      - name: Run repeated detection and failure scenarios
        run: python3 scripts/buildchecker/lab.py gate --image buildchecker-lab:ci --out work/buildchecker/ci-gate

      - name: Prove a wrong oracle fails the gate
        shell: bash
        run: |
          set +e
          python3 scripts/buildchecker/gate.py --image buildchecker-lab:ci --out work/buildchecker/ci-bad-oracle --inject-bad-oracle
          code=$?
          set -e
          test "$code" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("work/buildchecker/ci-bad-oracle/gate-result.json").read_text())
          assert result["passed"] is False
          assert [case["case"] for case in result["cases"] if not case["passed"]] == ["fixed"]
          PY

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildchecker-lab-evidence
          path: work/buildchecker/ci-*/
          retention-days: 14
